[project]
name = "boilerplate"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.15.2"
dependencies = []

[dependency-groups]
dev = [
  "nodejs-wheel-binaries>=24.19.0",
  "prek>=0.5.11",
  "pyright>=1.1.414",
  "pytest>=9.2.0",
  "ruff>=0.17.5",
  "taplo>=0.9.3",
  "ty>=0.0.105",
]

[project.scripts]
dev = "src:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D",      # pydocstyle (all docstring rules)
  "CPY001", # missing copyright notice
  "COM812", # missing-trailing-comma (conflicts with ruff format)
  "INP001", # implicit-namespace-package
]


[tool.ruff.lint.flake8-annotations]
suppress-dummy-args = true

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"abc".msg = "Do not use the abc module."
"builtins.staticmethod".msg = "Use module-level functions or instance methods instead."
"typing.TYPE_CHECKING".msg = "Use ordinary runtime imports."
"typing.cast".msg = "Narrow or validate the value's type instead."
"typing.no_type_check".msg = "Use targeted type-checking suppressions instead."
"typing_extensions.TYPE_CHECKING".msg = "Use ordinary runtime imports."
"typing_extensions.cast".msg = "Narrow or validate the value's type instead."
"typing_extensions.no_type_check".msg = "Use targeted type-checking suppressions instead."
