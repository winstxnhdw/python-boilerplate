default_stages: [pre-commit]
default_install_hook_types:
  - pre-commit
  - commit-msg
  - post-checkout
  - post-merge
  - post-rewrite

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-case-conflict
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: check-toml
      - id: check-yaml
      - id: mixed-line-ending
      - id: check-symlinks
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.9
    hooks:
      - id: uv-lock
      - id: uv-sync

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix]

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.105
    hooks:
      - id: ty
        args: [--locked]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.1
    hooks:
      - id: markdownlint-cli2

  - repo: local
    hooks:
      - id: commit-body
        name: commit body blank line
        stages: [commit-msg]
        language: system
        entry: |
          uv run --no-project --python 3.15 python -c "
            from sys import argv
            lines = [line for line in open(argv[1]) if not line.startswith('#')]
            exit('line 2 must be blank' if len(lines) > 1 and lines[1].strip() else 0)
          "

      - id: taplo-fmt
        name: taplo fmt
        stages: [pre-commit]
        language: system
        types: [toml]
        entry: uv run taplo fmt
        env:
          UV_LOCKED: "1"

      - id: taplo-lint
        name: taplo lint
        stages: [pre-commit]
        language: system
        types: [toml]
        entry: uv run taplo lint
        env:
          UV_LOCKED: "1"
